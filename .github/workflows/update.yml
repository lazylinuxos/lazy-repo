name: update
run-name: "Automated update of ${{ github.ref_name }} by @${{ github.repository_owner }}[bot]"

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      repository:
        description: |-
          Location of the GitHub repository containing the package descriptions
          in the form of [HOST/]OWNER/REPO.
        type: string
        default: ${{ vars.PACKAGES_REPOSITORY }}

jobs:
  update-all:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Authenticate via app
        id: app-token
        if: ${{ vars.APP_CLIENT_ID }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dcarbone/install-jq-action@v3.2.0

      - name: Discover packages
        id: pkgs
        run: |
          list=$(find srcpkgs -mindepth 2 -maxdepth 2 -type f -name update.sh \
            | sed 's|srcpkgs/\([^/]*\)/update.sh|\1|' \
            | sort)
          {
            echo "packages<<EOF"
            echo "$list"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run all updates
        run: |
          while IFS= read -r pkg; do
            echo "Updating $pkg"
            bash "srcpkgs/$pkg/update.sh"
          done <<< "${{ steps.pkgs.outputs.packages }}"

      - name: Check for updates
        id: check-updates
        run: |
          if [[ -n "$(git diff --exit-code)" ]]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new updates"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updates
        if: ${{ steps.check-updates.outputs.has_updates == 'true' }}
        run: |
          git config --global user.name "${{ github.repository_owner }}[bot]"
          git config --global user.email "${{ vars.APP_CLIENT_ID }}+${{ github.repository_owner }}[bot]@users.noreply.github.com"
          git commit --all --message "Automated update"

      - name: Push updates
        if: ${{ steps.check-updates.outputs.has_updates == 'true' }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.ref }}
